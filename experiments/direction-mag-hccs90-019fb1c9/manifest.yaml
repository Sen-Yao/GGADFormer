objective:
  expected_trials: 75
  datasets: [Amazon, elliptic, tolokers]
  variants: [none, random_dir, random_mag, random_both, constant_mag]
  seeds: [0, 1, 2, 3, 4]
  metrics: [AUC.last, AP.last]
  aggregation:
    mean: true
    sample_std_ddof: 1
  post_hoc_selection_allowed: false
  smoke_counts_as_formal: false

scientific_protocol:
  perturbation_space: projected reconstruction error p_i
  pseudo_anomaly_formula: h_i + beta * magnitude * direction
  beta: 0.3
  sample_rate: 0.15
  ring_R_min: 0.3
  ring_R_max: 1
  data_split_seed: 42
  rng:
    every_forward_random_controls: true
    direction_rng: independent torch.Generator
    magnitude_rng: independent torch.Generator
    default_direction_seed_formula: seed * 1000003 + 1729
    default_magnitude_seed_formula: seed * 1000003 + 7919
  magnitude_permutation:
    mechanism: nonzero cyclic shift in current generation subset
    n_ge_2: exact multiset preserved and no fixed points
    n_lt_2: explicit identity clone
    detach_magnitudes: false
    random_mag_gradient_path: learned direction and permuted donor magnitude
    random_both_gradient_path: permuted donor magnitude only

authority_config:
  missing_requested_sources:
    - tmp/aaai-migration/overleaf-project/04_Method.tex
    - tmp/aaai-migration/overleaf-project/05_EXP.tex
    - tmp/aaai-migration/overleaf-project/supplement.tex
    - tmp/aaai-migration/overleaf-project/tables/ablation.tex
  decision_rule: use reproduction.sh plus W&B config/run evidence; do not use unprovenanced historical means as authority
  Amazon:
    basis: reproduction.sh command and matching HCCS/GGADFormer historical finished runs
    config:
      batch_size: 1024
      num_epoch: 100
      peak_lr: 0.0003
      end_lr: 0.0001
      pp_k: 5
      progregate_alpha: 0.4
      lambda_rec_emb: 0.1
      rec_loss_weight: 1
      ring_loss_weight: 1
      train_rate: 0.05
      warmup_updates: 50
  elliptic:
