program: run.py
method: grid
metric:
  name: AUC.last
  goal: maximize
parameters:
  batch_size:
    value: 1024
  dataset:
    value: tolokers
  end_lr:
    value: 0.00001
  lambda_rec_emb:
    values: [5, 0.1]
  num_epoch:
    value: 100
  outlier_beta:
    value: 0.3
  peak_lr:
    value: 0.0001
  pp_k:
    value: 10
  progregate_alpha:
    value: 0.9
  rec_loss_weight:
    value: 1
  ring_R_max:
    value: 1
  ring_R_min:
    value: 0.3
  ring_loss_weight:
    value: 1
  seed:
    values: [0, 1, 2, 3, 4]
  train_rate:
    value: 0.05
  warmup_updates:
    value: 5

